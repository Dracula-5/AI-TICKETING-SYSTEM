# Serves the built SPA and proxies /api to the backend, so browser, SPA and
# API share one origin (the refresh cookie stays first-party, no CORS needed).
# In the VM deployment, Caddy terminates TLS in front of this container.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 11m;  # attachments are capped at 10 MB by the API

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Security headers are added per SPA location (see security-headers.conf);
  # /api responses carry the backend's own headers.

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
