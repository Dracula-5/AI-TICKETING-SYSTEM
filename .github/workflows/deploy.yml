name: Deploy

# Builds immutable images tagged with the commit SHA, pushes them to GHCR,
# then deploys that exact SHA to the VM over SSH. The deploy job runs only
# when the deployment secrets exist, and inside the "production" environment
# (add required reviewers there for a manual approval gate).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to the triggering commit)"
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Build & push images
    # Only deploy commits whose CI passed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Lowercase registry path
        run: echo "REGISTRY_LC=${REGISTRY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY_LC }}/nexadesk-backend:${{ env.SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.REGISTRY_LC }}/nexadesk-web:${{ env.SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to VM
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_TARGET: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - name: Skip when no deployment target is configured
        if: env.HAS_TARGET != 'true'
        run: echo "::notice::DEPLOY_HOST or DEPLOY_SSH_KEY not configured — images were pushed, deployment skipped."
      - name: Deploy over SSH
        if: env.HAS_TARGET == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/nexadesk/deploy/deploy.sh ${{ env.SHA }}
