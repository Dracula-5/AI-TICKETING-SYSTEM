name: CI

on:
  push:
    branches: [main, nexadesk-transformation]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend quality gates ──────────────────────────────────────────────────
  backend-lint:
    name: Backend lint + types
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app

  backend-test-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: backend/coverage.xml }

  backend-test-postgres:
    name: Backend tests (PostgreSQL 16 + migrations)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: nexadesk, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: nexadesk_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexadesk" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nexadesk:ci-only@localhost:5432/nexadesk_test
      TEST_MIGRATIONS_DATABASE_URL: postgresql://nexadesk:ci-only@localhost:5432/nexadesk_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: PGPASSWORD=ci-only psql -h localhost -U nexadesk -d nexadesk_test -c "CREATE DATABASE nexadesk_migrations"
      - run: pytest

  # ── Dependency security ─────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit==2.10.1 && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  # ── End-to-end through the real UI ────────────────────────────────────────────
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test-sqlite, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env: { E2E_PYTHON: python, CI: "true" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: "frontend/playwright-report\nfrontend/e2e/screenshots" }

  # ── Containers ────────────────────────────────────────────────────────────────
  docker:
    name: Docker build + compose smoke test
    runs-on: ubuntu-latest
    needs: [backend-test-postgres, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for healthy stack
        run: |
          for i in $(seq 1 60); do
            curl -fsS localhost:3000/api/v1/organizations/portal/none -o /dev/null -w '%{http_code}' | grep -q 404 && break
            sleep 3
          done
          curl -fsS localhost:8000/ready | tee /dev/stderr | grep -q '"migrations":"ok"'
          curl -fsS -o /dev/null localhost:3000/
      - if: always()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
