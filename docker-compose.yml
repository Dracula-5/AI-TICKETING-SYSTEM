# Local full stack: PostgreSQL (with pgvector) + Redis + API + web.
#   docker compose up --build
#   docker compose exec backend python -m app.scripts.seed_demo   # optional demo data
# Web: http://localhost:3000   API docs: http://localhost:8000/api/docs

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexadesk}
      POSTGRES_USER: ${POSTGRES_USER:-nexadesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexadesk-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexadesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexadesk}:${POSTGRES_PASSWORD:-nexadesk-local-only}@postgres:5432/${POSTGRES_DB:-nexadesk}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret-not-for-deployment}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      FRONTEND_BASE_URL: http://localhost:3000
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    volumes:
      - attachments:/app/var/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  attachments:
