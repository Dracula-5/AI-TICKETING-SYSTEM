# Render Blueprint — public demo deployment on Render's free tier.
#
# Two web services built from this repository:
#   nexadesk-api  FastAPI backend (backend/Dockerfile); migrates on start.
#   nexadesk-web  React SPA behind nginx (frontend/Dockerfile); proxies /api
#                 (including the notification WebSocket) to nexadesk-api, so the
#                 browser sees one site and the login cookie stays first-party.
#
# The database is external (Neon free PostgreSQL, with pgvector). Values marked
# `sync: false` are asked for when the Blueprint is created; nothing secret is
# committed here. Step-by-step guide: docs/deployment.md → "Render (free tier)".
services:
  - type: web
    name: nexadesk-api
    runtime: docker
    plan: free
    region: oregon
    branch: nexadesk-transformation
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL          # Neon connection string, ending in ?sslmode=require
        sync: false
      - key: FRONTEND_BASE_URL     # https://<nexadesk-web>.onrender.com (links in emails)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: BACKGROUND_MODE       # no separate worker on the free tier
        value: inline
      - key: EMAIL_BACKEND         # emails are written to the service log
        value: console
      # AI on. Measured in a container limited like the free instance (512 MB, no
      # swap, 0.1 CPU; reports/render_free_tier.md): batch 32 was OOM-killed on a
      # large KB document; batch 4 + one thread + MALLOC_ARENA_MAX=2 levelled off
      # at ~360 MB (peaks ≤ 412 MB). More threads only burn the CPU quota.
      - key: AI_ENABLED
        value: "true"
      - key: EMBEDDING_THREADS
        value: "1"
      - key: EMBEDDING_BATCH_SIZE
        value: "4"
      - key: MALLOC_ARENA_MAX     # fewer glibc arenas: ~45 MB less growth under load
        value: "2"
      - key: LLM_PROVIDER          # text generation stays off (no provider approved)
        value: none
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: API_LIMIT_CONCURRENCY
        value: "20"
      - key: SEED_DEMO_ON_START    # demo organizations, seeded in the background after start (idempotent)
        value: "true"
      - key: DEMO_PASSWORD         # shared password of the demo accounts
        sync: false
      # Platform administrator (console at /platform: all organizations, sign-ups,
      # system health). Created at start-up when both are set; changing the
      # password here changes it on the next start.
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false

  - type: web
    name: nexadesk-web
    runtime: docker
    plan: free
    region: oregon
    branch: nexadesk-transformation
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM          # https://<nexadesk-api>.onrender.com (no trailing slash)
        sync: false
