# Prometheus for the single-VM stack (compose profile "observability").
# Targets are on the internal Docker network; the bearer token comes from
# METRICS_TOKEN via the container's start command (written to /tmp/metrics_token).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nexadesk-api
    authorization: { type: Bearer, credentials_file: /tmp/metrics_token }
    static_configs: [{ targets: ["backend:8000"] }]
  - job_name: nexadesk-worker
    authorization: { type: Bearer, credentials_file: /tmp/metrics_token }
    static_configs: [{ targets: ["worker:9101"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
